<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PhishGuard{% endblock %}</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a1120; --surface: #0f192b; --surface-2: #132036; --border: #243450; --border-strong: #34496c;
        --text: #e8edf5; --text-2: #b6c2d4; --muted: #8d9cb3; --accent: #2563eb; --accent-hover: #1d4fd0;
        --focus: #93bbff; --ok: #74d6a7; --ok-bg: #112a22; --danger: #ff9f97; --danger-bg: #2e1619;
        font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 16px; line-height: 1.55; color: var(--text); background: var(--bg);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); }
      .page { width: min(680px, 100%); margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      .brand { display: flex; align-items: center; gap: .55rem; padding-bottom: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); font-weight: 700; }
      .brand span { color: var(--muted); font-weight: 500; }
      .label { display: inline-block; margin: 0 0 .5rem; padding: .15rem .6rem; border: 1px solid var(--border-strong); border-radius: 99px; color: var(--text-2); font-size: .8rem; font-weight: 600; }
      h1 { margin: 0 0 .5rem; font-size: 1.75rem; line-height: 1.2; letter-spacing: -.01em; }
      h2 { margin: 0 0 .35rem; font-size: 1.1rem; }
      p, li { color: var(--text-2); }
      p { margin: 0 0 1rem; }
      strong { color: var(--text); }
      .card { margin: 0 0 .75rem; padding: 1.1rem 1.2rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
      .card p { margin: 0; }
      .step { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; margin-right: .5rem; border-radius: 50%; color: #fff; background: #1d3461; font-size: .85rem; font-weight: 700; }
      .next { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
      .button { display: inline-flex; justify-content: center; width: 100%; padding: .85rem 1.2rem; border: 1px solid var(--accent); border-radius: 8px; color: #fff; background: var(--accent); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .button:hover { background: var(--accent-hover); }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      fieldset { margin: 0 0 .75rem; padding: 1.1rem 1.2rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
      legend { float: left; width: 100%; margin-bottom: .75rem; padding: 0; color: var(--text); font-weight: 650; }
      legend + * { clear: both; }
      .qnum { display: block; margin-bottom: .2rem; color: var(--muted); font-size: .8rem; font-weight: 600; }
      .choice { display: flex; align-items: flex-start; gap: .65rem; margin: .45rem 0 0; padding: .7rem .8rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); cursor: pointer; }
      .choice:hover { border-color: var(--border-strong); }
      .choice:has(input:checked) { border-color: #3b82f6; background: #16294a; }
      .choice input { margin-top: .25rem; accent-color: #3b82f6; }
      .alert { padding: .75rem .9rem; border: 1px solid #5c2a2f; border-radius: 8px; color: var(--danger); background: var(--danger-bg); }
      .notice { color: var(--muted); font-size: .85rem; }
      .score { display: flex; align-items: baseline; gap: .75rem; margin: .25rem 0 1rem; }
      .score strong { font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
      .score span { color: var(--text-2); }
      ul.lessons { margin: 0; padding-left: 1.2rem; }
      ul.lessons li { margin: .5rem 0; }
      @media (min-width: 720px) { .page { padding-top: 2.5rem; } h1 { font-size: 2rem; } .button { width: auto; } }
    </style>
  </head>
  <body>
    <main class="page">
      {% block header %}
      <div class="brand">
        <svg width="22" height="25" viewBox="0 0 40 45" aria-hidden="true"><path d="M20 1.5 37 7.2v13.3c0 10.6-7 18.7-17 23-10-4.3-17-12.4-17-23V7.2z" fill="#2563eb"/><path d="M20 1.5 37 7.2v13.3c0 10.6-7 18.7-17 23z" fill="#1d4fd0"/><text x="20" y="27.5" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800">PG</text></svg>
        PhishGuard <span>· Awareness exercise</span>
      </div>
      {% endblock %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
