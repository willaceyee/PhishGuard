<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account verification</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #17212b; background: #f2f5f7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(420px, 100%); padding: 36px; border-radius: 14px; background: white; box-shadow: 0 18px 45px #23344320; }
      h1 { margin-top: 0; font-size: 1.65rem; }
      p { color: #52606d; line-height: 1.55; }
      label { display: block; margin: 18px 0 7px; font-weight: 700; }
      input { width: 100%; padding: 12px; border: 1px solid #a8b3bd; border-radius: 7px; }
      button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 7px; color: white; background: #1769aa; font-weight: 700; cursor: pointer; }
      .notice { margin-top: 22px; font-size: .78rem; color: #71808d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Verify your account</h1>
      <p>This controlled page measures whether a participant would continue after following an unexpected link.</p>
      <form method="post" action="{{ url_for('simulation.simulated_submit', token=token) }}">
        <button type="submit">I would continue</button>
      </form>
      <p class="notice">Authorized PhishGuard awareness simulation. This page never asks for or accepts credentials.</p>
    </main>
  </body>
</html>
